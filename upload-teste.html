<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste da API de imagens</title>
  <style>
    :root { font: 16px system-ui, sans-serif; color-scheme: light dark; }
    body { max-width: 760px; margin: 36px auto; padding: 0 18px; }
    form { display: grid; gap: 10px; max-width: 460px; }
    input, button { font: inherit; padding: 8px; }
    button { cursor: pointer; }
    #status { min-height: 1.5em; }
    #pictures { display: grid; gap: 12px; padding: 0; list-style: none; }
    .picture { display: flex; align-items: center; gap: 14px; border: 1px solid #8886; border-radius: 8px; padding: 12px; }
    .picture img { width: 96px; height: 80px; object-fit: cover; }
    .picture-info { flex: 1; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Teste da API de imagens</h1>
  <p>Rotas: <code>POST /pictures/</code> cria, <code>GET /pictures/</code> lista, <code>PUT /pictures/:id/photo</code> troca a foto e <code>DELETE /pictures/:id</code> exclui.</p>

  <h2>Enviar imagem</h2>
  <form id="upload-form">
    <label for="name">Nome</label>
    <input id="name" name="name" type="text" placeholder="Ex.: Álbum de viagem" required>
    <label for="file">Arquivo de imagem</label>
    <input id="file" name="file" type="file" accept="image/*" required>
    <button type="submit">Enviar imagem</button>
  </form>

  <h2>Imagens cadastradas</h2>
  <button id="refresh" type="button">Atualizar lista</button>
  <p id="status" role="status"></p>
  <ul id="pictures"></ul>

  <script>
    const form = document.querySelector("#upload-form");
    const list = document.querySelector("#pictures");
    const status = document.querySelector("#status");

    async function readResponse(response) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || `Erro HTTP ${response.status}`);
      return data;
    }

    async function loadPictures() {
      status.textContent = "Carregando imagens...";
      list.replaceChildren();
      try {
        const pictures = await readResponse(await fetch("/pictures/"));
        if (!pictures.length) {
          status.textContent = "Nenhuma imagem cadastrada.";
          return;
        }
        status.textContent = `${pictures.length} imagem(ns) encontrada(s).`;
        for (const picture of pictures) {
          const item = document.createElement("li");
          item.className = "picture";

          const image = document.createElement("img");
          image.src = "/" + String(picture.src || "").replaceAll("\\", "/");
          image.alt = picture.name || "Imagem enviada";

          const info = document.createElement("div");
          info.className = "picture-info";
          const title = document.createElement("strong");
          title.textContent = picture.name || "Sem nome";
          const id = document.createElement("div");
          id.textContent = `ID: ${picture._id}`;
          info.append(title, id);

          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Excluir";
          remove.addEventListener("click", () => deletePicture(picture._id));

          const replaceInput = document.createElement("input");
          replaceInput.type = "file";
          replaceInput.accept = "image/*";
          replaceInput.setAttribute("aria-label", `Escolher nova foto para ${picture.name || "imagem"}`);
          replaceInput.addEventListener("change", () => updatePhoto(picture._id, replaceInput));

          item.append(image, info, replaceInput, remove);
          list.append(item);
        }
      } catch (error) {
        status.textContent = `Falha ao buscar imagens: ${error.message}`;
      }
    }

    async function updatePhoto(id, input) {
      const file = input.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append("file", file);
      status.textContent = "Atualizando foto...";
      try {
        const data = await readResponse(await fetch(`/pictures/${encodeURIComponent(id)}/photo`, {
          method: "PUT",
          body: formData,
        }));
        status.textContent = data.msg || "Foto atualizada com sucesso!";
        await loadPictures();
      } catch (error) {
        status.textContent = `Falha ao atualizar foto: ${error.message}`;
        input.value = "";
      }
    }

    async function deletePicture(id) {
      if (!confirm("Deseja excluir esta imagem?")) return;
      try {
        const data = await readResponse(await fetch(`/pictures/${encodeURIComponent(id)}`, { method: "DELETE" }));
        status.textContent = data.msg || data.message || "Imagem excluída.";
        await loadPictures();
      } catch (error) {
        status.textContent = `Falha ao excluir: ${error.message}`;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      status.textContent = "Enviando imagem...";
      try {
        const data = await readResponse(await fetch("/pictures/", {
          method: "POST",
          body: new FormData(form),
        }));
        status.textContent = data.msg || "Imagem enviada com sucesso!";
        form.reset();
        await loadPictures();
      } catch (error) {
        status.textContent = `Falha no envio: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });

    document.querySelector("#refresh").addEventListener("click", loadPictures);
    loadPictures();
  </script>
</body>
</html>
